# Fly.io config for TaskFlow backend
app = "taskflow-backend-app"
primary_region = "sin" # Singapore — closest to you

[build]
  dockerfile = "Dockerfile.backend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
