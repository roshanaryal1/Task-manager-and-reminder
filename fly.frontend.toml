# Fly.io config for TaskFlow frontend
app = "taskflow-frontend-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.frontend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
