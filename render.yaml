services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: taskflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema ../prisma/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema ../prisma/schema.prisma && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: admin@taskmanager.app
      - key: PORT
        value: 5000

  # ─── Frontend ────────────────────────────────────────────────────────────────
  - type: web
    name: taskflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: taskflow-db
    databaseName: taskmanager
    plan: free
